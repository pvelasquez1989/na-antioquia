<!-- Usamos [style.display] para forzar al navegador a renderizarlo sí o sí -->
<div class="modal" [style.display]="isVisible ? 'flex' : 'none'" (click)="onOverlayClick($event)">
  <div class="modal-content" [class.modal-content--pdf]="currentMediaIsPdf" (click)="$event.stopPropagation()">
      <div class="carousel-progress" [attr.aria-label]="language.format('eventCounter', { current: currentImageIndex + 1, total: activeImages.length })">
        @for (image of activeImages; track image.src; let index = $index) {
          <span class="carousel-progress__item" [class.carousel-progress__item--active]="index === currentImageIndex"></span>
        }
      </div>
      <span class="close-button" [title]="language.t('close')" (click)="stopCarousel()">&times;</span>
      
      @if (activeImages.length > 1) {
        <span class="carousel-arrow prev" [title]="language.t('previous')" (click)="onPrevClick()">&#10094;</span>
        <span class="carousel-arrow next" [title]="language.t('next')" (click)="onNextClick()">&#10095;</span>
      }

      @if (currentImage && currentMediaIsVideo) {
        <video controls playsinline [muted]="false" preload="metadata" (loadedmetadata)="prepareVideoAudio($event)" (play)="onVideoPlay($event)" (ended)="onVideoEnded()">
          <source [src]="currentImage.src" type="video/mp4">
          Your browser does not support video playback.
        </video>
      } @else if (currentImage && currentMediaIsPdf) {
        <app-pdf-preview [src]="currentImage.src" [title]="currentImage.title ?? 'Vista previa del PDF'"></app-pdf-preview>
      } @else if (currentImage) {
        <img 
          [src]="currentImage.src"
          (error)="onImageError($event)" 
          [alt]="language.t('eventAlt')"
          (click)="onImageClick($event)"
          (mousedown)="pauseCarousel($event)"
          (mouseup)="resumeCarousel()"
          (mouseleave)="resumeCarousel()"
          (touchstart)="pauseCarousel()"
          (touchend)="resumeCarousel()"
          (touchcancel)="resumeCarousel()"
          [style.cursor]="currentCursor">
      }
  </div>
</div>
